name: Founding invoice recovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vayon-founding-invoice-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'Cryptoprax/vayon' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Recover founding invoice
        shell: bash
        env:
          RECOVERY_SECRET: ${{ secrets.VAYON_RECONCILIATION_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "$RECOVERY_SECRET" || "$RECOVERY_SECRET" == *$'\n'* || "$RECOVERY_SECRET" == *$'\r'* ]]; then
            echo "::error::Recovery secret is missing or invalid."
            exit 1
          fi
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          # Supply the header on stdin; never log credentials or response bodies.
          # No redirects or immediate retries: the server may still be working.
          if status="$(printf 'Authorization: Bearer %s\n' "$RECOVERY_SECRET" | curl \
            --fail-with-body --show-error --silent \
            --proto '=https' --request GET \
            --connect-timeout 15 --max-time 330 \
            --header @- --header 'Accept: application/json' \
            --output "$response_file" --write-out '%{http_code}' \
            'https://www.vayon.online/api/billing/paddle/founding/recover-invoice')"; then
            :
          else
            curl_exit=$?
            if [[ "$curl_exit" -eq 22 && "$status" =~ ^[1-5][0-9][0-9]$ ]]; then
              echo "::error::Invoice recovery returned HTTP ${status}."
            else
              echo "::error::Invoice recovery request failed."
            fi
            exit 1
          fi
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            if [[ "$status" =~ ^[1-5][0-9][0-9]$ ]]; then
              echo "::error::Invoice recovery returned HTTP ${status}."
            else
              echo "::error::Invoice recovery returned an invalid HTTP status."
            fi
            exit 1
          fi
          if ! jq -e 'type == "object" and .ok == true' "$response_file" > /dev/null 2>&1; then
            echo "::error::Invoice recovery did not confirm success."
            exit 1
          fi
          echo "Founding invoice recovery completed successfully."
